<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IradahTraining — Votre parcours de formation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="hero">

    <p class="brand ">IradahTraining</p>

    <div class="badge">
      <span class="badge-dot"></span>
      Programme en ligne · Accès immédiat
    </div>

    <h1 class="title">
      Montez en<br>compétence<span class="dot-with-canard">.</span><br>
      <em>Vraiment.</em>
    </h1>

    <p class="subtitle">
      Une formation conçue pour les professionnels qui veulent progresser vite,<br>
      sans sacrifier la qualité ni leur temps.
    </p>

    <div class="stats">
      <div class="stat">
        <span class="stat-number">4 800+</span>
        <span class="stat-label">Apprenants</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-number">98%</span>
        <span class="stat-label">Satisfaction</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <span class="stat-number">12h</span>
        <span class="stat-label">De contenu</span>
      </div>
    </div>

    <a href="https://example.com/formation" class="cta-button" target="_blank" rel="noopener noreferrer">
      <span class="cta-text">Accéder à la formation</span>
      <span class="cta-icon">→</span>
    </a>

  </main>
</body>
</html>
